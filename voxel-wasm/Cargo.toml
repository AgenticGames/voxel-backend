[package]
name = "voxel-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
# Panics surface as readable console errors instead of "unreachable executed".
console_error_panic_hook = "0.1"
glam.workspace = true
serde_json.workspace = true
voxel-region = { path = "../voxel-region" }
voxel-gen = { path = "../voxel-gen" }
voxel-sleep = { path = "../voxel-sleep" }
