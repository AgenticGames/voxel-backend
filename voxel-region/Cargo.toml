[package]
name = "voxel-region"
version = "0.1.0"
edition = "2021"

[dependencies]
glam.workspace = true
voxel-core = { path = "../voxel-core" }
voxel-gen = { path = "../voxel-gen" }
voxel-sleep = { path = "../voxel-sleep" }
voxel-fluid = { path = "../voxel-fluid" }

# Browsers can't spawn rayon's worker threads; wasm builds run sequentially.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon.workspace = true
